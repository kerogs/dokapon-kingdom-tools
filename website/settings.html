<!DOCTYPE html>
<html lang="en">

<head>
	<base href="">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dokapon Kingdom Tools</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_simple.min.css">
	<link rel="stylesheet" href="./assets/css/style.css">

	<link rel="shortcut icon" href="./assets/images/icon.webp" type="image/x-icon">
</head>

<body style="display: flex; align-items: center; justify-content: center;">

	<div class="settings">
		<aside>
			<nav>
				<a href="/"><img style="width: 100%;" src="./assets//images/banner.webp" alt=""></a>
				<button class="navBtn active" data-page="primarycolors">Primary colors</button>
				<button class="navBtn" data-page="background">Background</button>
				<button class="navBtn" data-page="wallpaper">Wallpaper</button>
			</nav>
		</aside>
		<div class="settingsContainer">
			<div class="settingsTitle">
				<h1>Settings</h1>
			</div>
			<div id="title">
				Primary colors
			</div>
			<div class="settingsBody">

				<!-- here go option -->
				<div id="primarycolors"></div>
				<div id="background" hidden></div>
				<div id="wallpaper" hidden></div>

			</div>
		</div>
	</div>

</body>
<script src="./assets/js/main.js"></script>
<script>

	if (document.querySelector('.settings')) {
		const pages = {
			primarycolors: { key: 'prim', list: PRIMARY },
			background: { key: 'theme', list: BACKGROUND },
			wallpaper: { key: 'bg', list: WALLPAPER },
		};

		for (const [id, { key, list }] of Object.entries(pages)) {
			const box = document.getElementById(id);
			box.innerHTML = list.map(o => `
            <div class="primarycolors__item${state[key] === o.id ? ' active' : ''}" data-id="${o.id}" style="background:${o.bg}">
                <div class="info">
                    <p style="color:${o.fg}">${o.name}</p>
                    <p class="muted" style="color:${o.fg};opacity:.7">${o.sub ?? o.bg}</p>
                </div>
            </div>`).join('');

			box.onclick = e => {
				const item = e.target.closest('.primarycolors__item');
				if (!item) return;
				state[key] = item.dataset.id;
				setCookie(key, state[key]);
				applyTheme(); // instant update
				box.querySelector('.active')?.classList.remove('active');
				item.classList.add('active');
			};
		}

		const title = document.getElementById('title');
		document.querySelectorAll('.navBtn').forEach(btn => btn.onclick = () => {
			document.querySelector('.navBtn.active').classList.remove('active');
			btn.classList.add('active');
			title.textContent = btn.textContent;
			for (const id in pages) document.getElementById(id).hidden = id !== btn.dataset.page;
		});
	}

</script>

</html>
